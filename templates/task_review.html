<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Task Reflection | Prodigiter</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #0f172a;
      background: #f8fafc;
    }
    body { margin: 0; }
    header {
      padding: 1rem 2rem;
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      font-size: 1.15rem;
      font-weight: 700;
    }
    main {
      width: min(760px, calc(100% - 2rem));
      margin: 2rem auto;
      padding: 1.5rem;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
    }
    fieldset {
      margin: 1.25rem 0;
      padding: 1rem;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
    }
    legend { padding: 0 0.4rem; font-weight: 650; }
    label {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.5rem 0;
      cursor: pointer;
    }
    button {
      padding: 0.7rem 1rem;
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    button:disabled { background: #94a3b8; cursor: wait; }
    #generated-review {
      margin: 1rem 0;
      padding: 1rem;
      background: #f8fafc;
      border-left: 4px solid #2563eb;
      white-space: pre-wrap;
    }
    #status { color: #b91c1c; }
    .notice { color: #475569; }
  </style>
</head>
<body>
  <header>Prodigiter · Task Reflection</header>
  <main>
    <h1 id="task-title">Loading task…</h1>
    <p id="privacy-note" class="notice">
      Choose an answer for each question. Your selected answers and task title are sent to OpenAI to draft a review; your name and email are not sent. Review the generated text before copying it to the external review site.
    </p>
    <form id="reflection-form">
      <div id="questions"></div>
      <button id="generate-button" type="submit">Generate review</button>
    </form>
    <p id="status" role="status"></p>
    <section id="review-section" class="hidden" hidden>
      <h2>Your generated review</h2>
      <div id="generated-review"></div>
      <button id="copy-redirect-button" type="button">Copy and redirect</button>
    </section>
  </main>
  <script>
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const progressId = pathParts[1];
    const token = pathParts[2];
    const form = document.getElementById('reflection-form');
    const status = document.getElementById('status');
    const generateButton = document.getElementById('generate-button');
    const reviewSection = document.getElementById('review-section');
    let redirectUrl = '';
    let reviewText = '';

    async function loadReflection() {
      try {
        const response = await fetch(
          `/api/task-review/${encodeURIComponent(progressId)}/${encodeURIComponent(token)}`
        );
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'This task reflection link is unavailable.');

        document.getElementById('task-title').textContent =
          `${data.course_title} · ${data.lesson_title}`;
        redirectUrl = data.redirect_url;
        const questionContainer = document.getElementById('questions');
        data.questions.forEach(question => {
          const fieldset = document.createElement('fieldset');
          const legend = document.createElement('legend');
          legend.textContent = question.prompt;
          fieldset.appendChild(legend);

          question.options.forEach(option => {
            const label = document.createElement('label');
            const input = document.createElement('input');
            input.type = 'radio';
            input.name = question.id;
            input.value = option.value;
            input.required = true;
            input.checked = data.answers[question.id] === option.value;
            label.append(input, document.createTextNode(option.label));
            fieldset.appendChild(label);
          });
          questionContainer.appendChild(fieldset);
        });

        if (data.generated_review) {
          showReview(data.generated_review);
          form.hidden = true;
        }
      } catch (error) {
        form.hidden = true;
        status.textContent = error.message || 'Could not load the task reflection.';
      }
    }

    function showReview(review) {
      reviewText = review;
      document.getElementById('generated-review').textContent = review;
      reviewSection.hidden = false;
      reviewSection.classList.remove('hidden');
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!form.reportValidity()) return;

      const answers = Object.fromEntries(new FormData(form).entries());
      generateButton.disabled = true;
      status.textContent = 'Generating your review…';
      try {
        const response = await fetch(
          `/api/task-review/${encodeURIComponent(progressId)}/${encodeURIComponent(token)}/generate`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ answers }),
          }
        );
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Could not generate the review.');
        redirectUrl = data.redirect_url;
        showReview(data.review);
        form.hidden = true;
        status.textContent = 'Review generated. Check it, then copy and open the review site.';
      } catch (error) {
        status.textContent = error.message || 'Could not generate the review.';
      } finally {
        generateButton.disabled = false;
      }
    });

    document.getElementById('copy-redirect-button').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(reviewText);
      } catch (error) {
        const temporaryInput = document.createElement('textarea');
        temporaryInput.value = reviewText;
        temporaryInput.style.position = 'fixed';
        temporaryInput.style.opacity = '0';
        document.body.appendChild(temporaryInput);
        temporaryInput.select();
        const copied = document.execCommand('copy');
        temporaryInput.remove();
        if (!copied) {
          status.textContent = 'Could not copy the review. Allow clipboard access and try again.';
          return;
        }
      }
      window.location.assign(redirectUrl);
    });

    loadReflection();
  </script>
</body>
</html>
